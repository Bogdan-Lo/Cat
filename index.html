<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You Cat</title>

  <style>
    * {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: center;
  background:
    radial-gradient(circle at top, #ffffff 0%, #f4edff 35%, #d8c7ff 100%);
  font-family: "Comic Sans MS", "Trebuchet MS", sans-serif;
  overflow: hidden;
}

.scene {
  position: relative;
  width: min(900px, 100vw);
  height: min(600px, 100dvh);
  background:
    linear-gradient(135deg, #fff7ff 0%, #efe3ff 45%, #d8c7ff 100%);
  overflow: hidden;
  border-radius: 24px;
  box-shadow: 0 25px 80px rgba(111, 72, 160, 0.22);
}

.message {
  position: absolute;
  left: 50%;
  top: 215px;
  width: max-content;
  max-width: 90%;
  transform: translateX(-10%);
  color: #5f3f8f;
  font-size: clamp(34px, 6vw, 68px);
  line-height: 1.1;
  letter-spacing: 1.5px;
  text-align: center;
  white-space: nowrap;
  z-index: 5;
  transform-origin: center;
  text-shadow: 0 3px 0 rgba(95, 63, 143, 0.12);
}

.black-cat {
  position: absolute;
  left: calc(50% - 270px);
  top: 205px;
  width: 245px;
  height: 150px;
  z-index: 8;
  will-change: transform, left, top, opacity;
}

.black-cat .body {
  position: absolute;
  left: 55px;
  top: 45px;
  width: 135px;
  height: 78px;
  background: #020202;
  border-radius: 70px 70px 45px 45px;
}

.black-cat .head {
  position: absolute;
  left: 130px;
  top: 20px;
  width: 82px;
  height: 82px;
  background: #020202;
  border-radius: 50%;
  animation: calmHead 2.4s ease-in-out infinite;
}

.black-cat .ear {
  position: absolute;
  top: -14px;
  width: 34px;
  height: 34px;
  background: #020202;
  clip-path: polygon(50% 0, 0 100%, 100% 100%);
}

.black-cat .ear.left {
  left: 8px;
  transform: rotate(-20deg);
}

.black-cat .ear.right {
  right: 2px;
  transform: rotate(25deg);
}

.black-cat .eye {
  position: absolute;
  top: 34px;
  width: 18px;
  height: 18px;
  background: white;
  border-radius: 50%;
  animation: blink 2.8s infinite;
}

.black-cat .eye.left {
  left: 27px;
}

.black-cat .eye.right {
  right: 19px;
}

.black-cat .tail {
  position: absolute;
  left: 5px;
  top: 105px;
  width: 120px;
  height: 22px;
  background: #020202;
  border-radius: 30px;
  transform-origin: right center;
  animation: tailMove 1.1s ease-in-out infinite alternate;
}

.black-cat .paw {
  position: absolute;
  left: 170px;
  top: 108px;
  width: 55px;
  height: 18px;
  background: #020202;
  border-radius: 20px;
  transform-origin: left center;
}

.black-cat .leg {
  position: absolute;
  top: 112px;
  width: 50px;
  height: 20px;
  background: #020202;
  border-radius: 20px;
}

.black-cat .leg.one {
  left: 82px;
}

.black-cat .leg.two {
  left: 132px;
}

.video-box {
  position: absolute;
  left: 50%;
  top: 190px;
  width: min(320px, 82vw);
  aspect-ratio: 16 / 9;
  transform: translateX(-50%) scale(0.4);
  opacity: 0;
  border-radius: 22px;
  overflow: hidden;
  z-index: 4;
  background: #ffffff;
  border: 4px solid #ffffff;
  box-shadow: 0 18px 45px rgba(95, 63, 143, 0.22);
  cursor: pointer;
  touch-action: manipulation;
}

.video-box video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.video-placeholder {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 20px;
  color: #0f5870;
  text-align: center;
  font-size: 18px;
  background:
    radial-gradient(circle at 20% 20%, rgba(255, 119, 169, 0.22), transparent 35%),
    radial-gradient(circle at 80% 70%, rgba(15, 88, 112, 0.16), transparent 35%),
    #fff;
}
.video-controls {
  position: absolute;
  left: 50%;
  bottom: 12px;
  display: flex;
  gap: 10px;
  transform: translateX(-50%);
  z-index: 10;
  opacity: 0;
  pointer-events: none;
  transition: 0.25s;
}

.video-box:hover .video-controls,
.video-box:focus-within .video-controls {
  opacity: 1;
  pointer-events: auto;
}

.video-control-button {
  border: none;
  padding: 9px 14px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.9);
  color: #333;
  font-size: 14px;
  cursor: pointer;
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.18);
  backdrop-filter: blur(8px);
}

.video-control-button:hover {
  background: #ffffff;
  transform: translateY(-1px);
}

.video-box.fullscreen-mode .video-controls,
.video-box:fullscreen .video-controls,
.video-box:-webkit-full-screen .video-controls {
  opacity: 1;
  pointer-events: auto;
  bottom: 28px;
}

.video-box:fullscreen {
  width: 100vw;
  height: 100vh;
  border-radius: 0;
  border: none;
  background: #000;
}

.video-box:fullscreen video {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.video-box:-webkit-full-screen {
  width: 100vw;
  height: 100vh;
  border-radius: 0;
  border: none;
  background: #000;
}

.video-box:-webkit-full-screen video {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.start-button,
.again-button {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  padding: 15px 28px;
  border: none;
  border-radius: 12px;
  background: white;
  color: #555;
  font-size: 18px;
  cursor: pointer;
  box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
  transition: 0.25s;
  z-index: 20;
}

.start-button {
  bottom: 55px;
}

.again-button {
  bottom: 35px;
  opacity: 0;
  pointer-events: none;
}

.start-button:hover,
.again-button:hover {
  transform: translateX(-50%) translateY(-3px);
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.16);
}

.sparkle {
  position: absolute;
  color: #ff77a9;
  font-size: 24px;
  opacity: 0;
}

.sparkle.one {
  left: 230px;
  top: 115px;
}

.sparkle.two {
  right: 230px;
  top: 130px;
}

.sparkle.three {
  left: 50%;
  top: 90px;
}

/* SAKURA BACKGROUND */

.petal {
  position: absolute;
  top: -30px;
  width: 14px;
  height: 20px;
  background: #ffb7cf;
  border-radius: 80% 0 80% 0;
  opacity: 0.8;
  z-index: 2;
  animation-name: petalFall;
  animation-timing-function: linear;
  animation-iteration-count: infinite;
}

.petal-one {
  left: 12%;
  animation-duration: 8s;
  animation-delay: 0s;
}

.petal-two {
  left: 24%;
  animation-duration: 10s;
  animation-delay: 1.5s;
}

.petal-three {
  left: 36%;
  animation-duration: 9s;
  animation-delay: 0.7s;
}

.petal-four {
  left: 48%;
  animation-duration: 11s;
  animation-delay: 2.2s;
}

.petal-five {
  left: 60%;
  animation-duration: 8.5s;
  animation-delay: 1s;
}

.petal-six {
  left: 72%;
  animation-duration: 10.5s;
  animation-delay: 0.4s;
}

.petal-seven {
  left: 84%;
  animation-duration: 9.5s;
  animation-delay: 1.8s;
}

.petal-eight {
  left: 18%;
  animation-duration: 12s;
  animation-delay: 3s;
}

.petal-nine {
  left: 66%;
  animation-duration: 12.5s;
  animation-delay: 2.7s;
}

.petal-ten {
  left: 92%;
  animation-duration: 9.8s;
  animation-delay: 3.5s;
}

/* PLAY ANIMATIONS */

.scene.play .message {
  animation: textFall 7.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
}

.scene.play .black-cat {
  animation: blackCatJump 8.4s cubic-bezier(0.35, 0, 0.25, 1) forwards;
}

.scene.play .black-cat .paw {
  animation: pawTouch 7.6s ease-in-out forwards;
}

.scene.play .video-box {
  animation: videoAppear 7.6s ease-in-out forwards;
}

.scene.play .again-button {
  animation: buttonAppear 7.6s ease-in-out forwards;
}

.scene.play .start-button {
  opacity: 0;
  pointer-events: none;
}

.scene.play .sparkle {
  animation: sparkle 7.6s ease-in-out forwards;
}

.scene.play .sparkle.two {
  animation-delay: 0.2s;
}

.scene.play .sparkle.three {
  animation-delay: 0.4s;
}

/* KEYFRAMES */

@keyframes textFall {
  0%, 30% {
    top: 215px;
    left: 50%;
    transform: translateX(-15%) rotate(0deg);
  }

  38% {
    top: 232px;
    left: 50%;
    transform: translateX(-10%) rotate(7deg);
  }

  58% {
    top: 88px;
    left: 50%;
    transform: translateX(-50%) rotate(-8deg);
  }

  76% {
    top: 100px;
    left: 50%;
    transform: translateX(-50%) rotate(3deg);
  }

  88%, 100% {
    top: 65px;
    left: 50%;
    transform: translateX(-50%) rotate(0deg);
  }
}

@keyframes blackCatJump {
  0%, 24% {
    left: calc(50% - 270px);
    top: 205px;
    transform: translateY(0) rotate(0deg) scale(1);
    opacity: 1;
  }

  32% {
    left: calc(50% - 245px);
    top: 205px;
    transform: translateY(3px) rotate(-2deg) scale(1.02);
  }

  42% {
    left: calc(50% - 170px);
    top: 155px;
    transform: translateY(-18px) rotate(5deg) scale(1.04);
  }

  55% {
    left: calc(50% - 40px);
    top: 55px;
    transform: translateY(-28px) rotate(16deg) scale(1.06);
    opacity: 1;
  }

  68% {
    left: calc(50% + 10px);
    top: 150px;
    transform: translateY(10px) rotate(24deg) scale(0.94);
    opacity: 0.85;
  }

  78% {
    left: calc(50% + 35px);
    top: 275px;
    transform: translateY(0) rotate(30deg) scale(0.78);
    opacity: 0;
  }

  100% {
    opacity: 0;
  }
}

@keyframes pawTouch {
  0%, 23% {
    transform: rotate(0deg) translateX(0);
  }

  30%, 40% {
    transform: rotate(-18deg) translateX(18px);
  }

  52%, 100% {
    transform: rotate(8deg) translateX(0);
  }
}

@keyframes videoAppear {
  0%, 58% {
    opacity: 0;
    transform: translateX(-50%) scale(0.4) translateY(70px);
  }

  72% {
    opacity: 1;
    transform: translateX(-50%) scale(1.06) translateY(0);
  }

  84%, 100% {
    opacity: 1;
    transform: translateX(-50%) scale(1) translateY(0);
  }
}

@keyframes buttonAppear {
  0%, 82% {
    opacity: 0;
    pointer-events: none;
  }

  100% {
    opacity: 1;
    pointer-events: auto;
  }
}

@keyframes calmHead {
  0%, 100% {
    transform: translateY(0) rotate(0deg);
  }

  50% {
    transform: translateY(2px) rotate(1deg);
  }
}

@keyframes blink {
  0%, 90%, 100% {
    transform: scaleY(1);
  }

  95% {
    transform: scaleY(0.08);
  }
}

@keyframes tailMove {
  from {
    transform: rotate(1deg);
  }

  to {
    transform: rotate(-8deg);
  }
}

@keyframes sparkle {
  0%, 78% {
    opacity: 0;
    transform: scale(0) rotate(0deg);
  }

  88% {
    opacity: 1;
    transform: scale(1.25) rotate(15deg);
  }

  100% {
    opacity: 0.85;
    transform: scale(1) rotate(0deg);
  }
}

@keyframes petalFall {
  0% {
    transform: translateY(-40px) translateX(0) rotate(0deg);
    opacity: 0;
  }

  10% {
    opacity: 0.9;
  }

  50% {
    transform: translateY(300px) translateX(-45px) rotate(180deg);
  }

  100% {
    transform: translateY(680px) translateX(45px) rotate(360deg);
    opacity: 0;
  }
}

@keyframes crownFloat {
  0%, 100% {
    transform: translateY(0) scale(1);
  }

  50% {
    transform: translateY(-4px) scale(1.02);
  }
}

/* ADAPTIVE */

@media (max-width: 650px) {
  body {
    align-items: center;
  }

  .scene {
    width: min(430px, 100vw);
    height: min(720px, 100dvh);
    min-height: 560px;
    border-radius: 0;
  }

  .message {
    left: 50%;
    top: 210px;
    width: 92vw;
    max-width: 360px;
    transform: translateX(-50%) rotate(0deg);
    font-size: clamp(30px, 10vw, 46px);
    line-height: 1.08;
    letter-spacing: 1px;
    white-space: normal;
    overflow-wrap: anywhere;
    transform-origin: center;
  }

  .black-cat {
    left: 50%;
    top: 405px;
    transform: translateX(-50%) translateY(0) rotate(0deg) scale(0.7);
    transform-origin: center center;
  }

  .video-box {
    top: 190px;
    width: min(330px, 86vw);
  }

  .start-button {
    bottom: max(28px, env(safe-area-inset-bottom));
  }

  .again-button {
    bottom: max(22px, env(safe-area-inset-bottom));
  }

  .sparkle.one {
    left: 12%;
    top: 95px;
  }

  .sparkle.two {
    right: 12%;
    top: 120px;
  }

  .sparkle.three {
    left: 48%;
    top: 80px;
  }

  .scene.play .message {
    animation: mobileTextFall 7.8s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
  }

  .scene.play .black-cat {
    animation: mobileCatJump 7.8s cubic-bezier(0.35, 0, 0.2, 1) forwards;
  }

  .scene.play .black-cat .paw {
    animation: mobilePawTouch 7.8s ease-in-out forwards;
  }

  @keyframes mobileTextFall {
    0%, 44% {
      top: 210px;
      left: 50%;
      transform: translateX(-50%) rotate(0deg);
    }

    48% {
      top: 215px;
      left: 50%;
      transform: translateX(-50%) rotate(7deg);
    }

    58% {
      top: 105px;
      left: 50%;
      transform: translateX(-50%) rotate(-8deg);
    }

    72% {
      top: 118px;
      left: 50%;
      transform: translateX(-50%) rotate(4deg);
    }

    86%, 100% {
      top: 72px;
      left: 50%;
      transform: translateX(-50%) rotate(0deg);
    }
  }

  @keyframes mobileCatJump {
    0%, 16% {
      left: 50%;
      top: 405px;
      transform: translateX(-50%) translateY(0) rotate(0deg) scale(0.7);
      opacity: 1;
    }

    28% {
      left: 50%;
      top: 345px;
      transform: translateX(-50%) translateY(-10px) rotate(-2deg) scale(0.72);
      opacity: 1;
    }

    40% {
      left: 50%;
      top: 270px;
      transform: translateX(-50%) translateY(-22px) rotate(3deg) scale(0.74);
      opacity: 1;
    }

    48% {
      left: 50%;
      top: 220px;
      transform: translateX(-50%) translateY(-28px) rotate(9deg) scale(0.76);
      opacity: 1;
    }

    56% {
      left: 50%;
      top: 250px;
      transform: translateX(-50%) translateY(-8px) rotate(15deg) scale(0.7);
      opacity: 0.95;
    }

    70% {
      left: 50%;
      top: 340px;
      transform: translateX(-50%) translateY(0) rotate(24deg) scale(0.62);
      opacity: 0.55;
    }

    82%, 100% {
      left: 50%;
      top: 430px;
      transform: translateX(-50%) translateY(0) rotate(30deg) scale(0.5);
      opacity: 0;
    }
  }

  @keyframes mobilePawTouch {
    0%, 40% {
      transform: rotate(0deg) translateX(0) translateY(0);
    }

    46%, 52% {
      transform: rotate(-26deg) translateX(18px) translateY(-8px);
    }

    60%, 100% {
      transform: rotate(8deg) translateX(0) translateY(0);
    }
  }
}
.music-button {
  position: absolute;
  right: 18px;
  bottom: 18px;
  padding: 11px 16px;
  border: none;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.88);
  color: #5f3f8f;
  font-size: 14px;
  cursor: pointer;
  z-index: 25;
  box-shadow: 0 8px 22px rgba(95, 63, 143, 0.18);
  backdrop-filter: blur(8px);
  transition: 0.25s;
}

.music-button:hover {
  transform: translateY(-2px);
  background: #ffffff;
}

.music-button.is-playing {
  background: #5f3f8f;
  color: #ffffff;
}

@media (max-width: 650px) {
  .music-button {
    right: 12px;
    bottom: max(82px, calc(env(safe-area-inset-bottom) + 72px));
    padding: 10px 14px;
    font-size: 13px;
  }
}
  </style>
</head>

<body>
  <div class="scene" id="scene">
    <div class="sakura-bg">
  <div class="sakura-tree">
    <div class="trunk"></div>
    <div class="branch branch-one"></div>
    <div class="branch branch-two"></div>
    <div class="branch branch-three"></div>

    <div class="crown crown-one"></div>
    <div class="crown crown-two"></div>
    <div class="crown crown-three"></div>
    <div class="crown crown-four"></div>
    <div class="crown crown-five"></div>
  </div>

  <div class="petal petal-one"></div>
  <div class="petal petal-two"></div>
  <div class="petal petal-three"></div>
  <div class="petal petal-four"></div>
  <div class="petal petal-five"></div>
  <div class="petal petal-six"></div>
  <div class="petal petal-seven"></div>
  <div class="petal petal-eight"></div>
  <div class="petal petal-nine"></div>
  <div class="petal petal-ten"></div>
</div>
    <div class="sparkle one">✦</div>
    <div class="sparkle two">✧</div>
    <div class="sparkle three">✦</div>

    <div class="message">Я люблю кошечек</div>

    <div class="black-cat">
      <div class="tail"></div>
      <div class="body"></div>
      <div class="head">
        <div class="ear left"></div>
        <div class="ear right"></div>
        <div class="eye left"></div>
        <div class="eye right"></div>
      </div>
      <div class="leg one"></div>
      <div class="leg two"></div>
      <div class="paw"></div>
    </div>

    <div class="video-box" id="videoBox">
        <video
            id="loveVideo"
            src="your-video.mp4"
            muted
            loop
            playsinline
            webkit-playsinline
            preload="metadata"
        ></video>

        <div class="video-placeholder" id="videoPlaceholder">
            Нажми на видео, чтобы открыть на весь экран
        </div>

        <div class="video-controls">
             <button class="video-control-button" id="pauseButton" type="button">
            Пауза
             </button>

            <button class="video-control-button" id="exitButton" type="button">
             Выйти
            </button>
        </div>
    </div>

    <button class="start-button" id="startButton">Запуск</button>
    <button class="again-button" onclick="location.reload()">Ещё раз</button>
    <audio id="bgMusic" src="music.mp3" loop preload="auto"></audio>

<button class="music-button" id="musicButton" type="button">
  Музыка: выкл
</button>
  </div>

  <script>
  const bgMusic = document.getElementById("bgMusic");
  const musicButton = document.getElementById("musicButton");
  const scene = document.getElementById("scene");
  const startButton = document.getElementById("startButton");
  const videoBox = document.getElementById("videoBox");
  const video = document.getElementById("loveVideo");
  const placeholder = document.getElementById("videoPlaceholder");
  const pauseButton = document.getElementById("pauseButton");
  const exitButton = document.getElementById("exitButton");

  musicButton.addEventListener("click", (event) => {
    event.stopPropagation();

    if (bgMusic.paused) {
        bgMusic.volume = 0.45;
        bgMusic.play().then(() => {
          musicButton.textContent = "Музыка: вкл";
          musicButton.classList.add("is-playing");
        }).catch(() => {});
    } else {
        bgMusic.pause();
        musicButton.textContent = "Музыка: выкл";
        musicButton.classList.remove("is-playing");
    }
  });

  function openFullscreen(element) {
    if (element.requestFullscreen) {
      return element.requestFullscreen();
    }

    if (element.webkitRequestFullscreen) {
      return element.webkitRequestFullscreen();
    }

    if (element.msRequestFullscreen) {
      return element.msRequestFullscreen();
    }

    return Promise.reject();
  }

  function closeFullscreen() {
    if (document.exitFullscreen) {
      return document.exitFullscreen();
    }

    if (document.webkitExitFullscreen) {
      return document.webkitExitFullscreen();
    }

    if (document.msExitFullscreen) {
      return document.msExitFullscreen();
    }

    return Promise.reject();
  }

  function playVideo() {
    placeholder.style.display = "none";
    video.play().catch(() => {});
  }

  function togglePause() {
    if (video.paused) {
      video.play().catch(() => {});
      pauseButton.textContent = "⏸";
    } else {
      video.pause();
      pauseButton.textContent = "▶";
    }
  }

  function updateFullscreenClass() {
    const fullscreenElement =
      document.fullscreenElement ||
      document.webkitFullscreenElement ||
      document.msFullscreenElement;

    if (fullscreenElement) {
      videoBox.classList.add("fullscreen-mode");
    } else {
      videoBox.classList.remove("fullscreen-mode");
    }
  }

  startButton.addEventListener("click", () => {
    scene.classList.add("play");

    setTimeout(() => {
      playVideo();
    }, 5200);
  });

  videoBox.addEventListener("click", () => {
    playVideo();

    openFullscreen(videoBox).catch(() => {
      if (video.webkitEnterFullscreen) {
        video.webkitEnterFullscreen();
      }
    });
  });

  pauseButton.addEventListener("click", (event) => {
    event.stopPropagation();
    togglePause();
  });

  exitButton.addEventListener("click", (event) => {
    event.stopPropagation();

    closeFullscreen().catch(() => {
      if (video.webkitExitFullscreen) {
        video.webkitExitFullscreen();
      }
    });
  });

  video.addEventListener("play", () => {
    pauseButton.textContent = "⏸";
  });

  video.addEventListener("pause", () => {
    pauseButton.textContent = "▶";
  });

  video.addEventListener("loadeddata", () => {
    placeholder.style.display = "none";
  });

  document.addEventListener("fullscreenchange", updateFullscreenClass);
  document.addEventListener("webkitfullscreenchange", updateFullscreenClass);
  document.addEventListener("msfullscreenchange", updateFullscreenClass);
</script>   
</body>
</html>
